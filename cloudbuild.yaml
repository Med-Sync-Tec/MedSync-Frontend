# Cloud Build pipeline para MedSync Frontend
# Build → push a Artifact Registry → deploy a Cloud Run
#
# Substitutions esperadas (configurar en el trigger de Cloud Build):
#   _REGION              ej. us-central1
#   _AR_REPO             nombre del repo en Artifact Registry (ej. medsync)
#   _SERVICE             nombre del servicio Cloud Run (ej. medsync-frontend)
#   _VITE_API_BASE_URL   URL del backend en Cloud Run
#   _VITE_FIREBASE_API_KEY
#   _VITE_FIREBASE_AUTH_DOMAIN
#   _VITE_FIREBASE_PROJECT_ID
#   _VITE_FIREBASE_APP_ID

steps:
  # 1. Build de la imagen con las VITE_* inyectadas
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - --build-arg=VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - --build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - .

  # 2. Push a Artifact Registry (ambos tags)
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
    waitFor: [build]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
    waitFor: [build]

  # 3. Deploy a Cloud Run (rolling, sin downtime)
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=5
      - --cpu-boost
      - --service-account=medsync-runtime@$PROJECT_ID.iam.gserviceaccount.com
    waitFor: [push-sha]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

serviceAccount: projects/$PROJECT_ID/serviceAccounts/medsync-build@$PROJECT_ID.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
